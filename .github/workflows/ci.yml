name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTS_VSCODE_VERSION: '1.145.2'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          check-latest: true
          node-version: '24'

      # npm 11.10.0 is the first release to support min-release-age.
      - name: Set up npm
        run: npm install --global npm@11.10.0

      - name: Install dependencies
        run: npm ci

      - name: Set up VS Code
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { downloadAndUnzipVSCode } from '@vscode/test-electron';

          const executable = await downloadAndUnzipVSCode(process.env.FTS_VSCODE_VERSION);
          const sandbox = join(dirname(executable), 'chrome-sandbox');
          execFileSync('sudo', ['chown', 'root:root', sandbox]);
          execFileSync('sudo', ['chmod', '4755', sandbox]);
          appendFileSync(process.env.GITHUB_ENV, `FTS_VSCODE_EXECUTABLE=${executable}\n`);
          NODE

      - name: Verify
        run: xvfb-run -a npm run verify
